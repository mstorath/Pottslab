name: Build and publish wheels

on:
  push:
    tags:
      - "v*"          # run on version tags, e.g. v1.0.1
  workflow_dispatch:  # allow manual runs from the Actions UI

jobs:
  # ── Build platform wheels ──────────────────────────────────────────────────
  build_wheels:
    name: Build ${{ matrix.target }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — x86_64 (manylinux, covers most servers and desktops)
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto

          # Linux — aarch64 (Raspberry Pi, AWS Graviton, Apple M-series via
          # emulation; QEMU is set up automatically by maturin-action)
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto

          # macOS — Apple Silicon
          # Intel macOS (macos-13) was dropped: GitHub-hosted Intel runners are
          # being retired and queue depth made the job time out at the 24h
          # maximum. Intel-Mac users can install from the sdist.
          - os: macos-14
            target: aarch64

          # Windows — x86_64
          - os: windows-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v4

      # Native Windows/macOS runners only have one Python on PATH by default,
      # so maturin's --interpreter 3.9..3.13 lookup fails. Pre-installing all
      # five versions via setup-python adds them to PATH. The manylinux
      # container build skips this step (the host setup doesn't reach inside
      # the container, which already ships every CPython we need).
      - name: Set up Python (native runners only)
        if: matrix.manylinux != 'auto'
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          # Build for every supported CPython interpreter.
          # PyPy is excluded because PyO3 support requires extra setup.
          args: >-
            --release
            --out dist
            --interpreter 3.9 3.10 3.11 3.12 3.13

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.os }}
          path: dist/*.whl

  # ── Build source distribution ──────────────────────────────────────────────
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to PyPI ────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    # Only publish on version-tag pushes, not on workflow_dispatch
    if: startsWith(github.ref, 'refs/tags/v')
    # Requires an environment named "pypi" configured in the repo settings
    # with PyPI as a trusted publisher (no API token needed).
    environment:
      name: pypi
      url: https://pypi.org/project/pottslab/
    permissions:
      id-token: write    # required for OIDC trusted publishing
      contents: write    # required for the GitHub Release step below

    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v4

      - name: Download all wheel and sdist artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses PyPI OIDC trusted publishing — no API token required.
        # Set up at: https://pypi.org/manage/account/publishing/
        # Project name: pottslab
        # Owner:        mstorath
        # Repository:   Pottslab
        # Workflow:     build_wheels.yml
        # Environment:  pypi

      - name: Extract release notes from CHANGELOG.md
        # Pulls the section bounded by `## <ver>` (bracket-tolerant) and
        # the next `## ` heading. Falls back to a tag-commits link if
        # the heading is missing or CHANGELOG.md doesn't exist.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              $0 ~ "^## \\[?" ver "\\]?( |$)" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          [ -s release-notes.md ] || echo "See [tag commits](https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME})." > release-notes.md

      - name: Create GitHub Release
        # Idempotent: updates an existing Release for this tag instead
        # of erroring, so manual pre-creation never blocks a re-run.
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*

      - name: Verify uploaded package (real install + import + call)
        # Defends against a class of silent failures where PyPI accepted
        # the upload but the package isn't actually usable (renamed module,
        # missing __init__, broken native binding, ABI mismatch, etc.).
        # CMF v0.1.7 added this after the previous verify step had been
        # silently passing for years against an unrelated placeholder
        # package — see devcontainer reports/11-cmf-v0.1.7-release.md.
        run: |
          # Brief delay so PyPI's CDN settles the new version.
          sleep 30
          pip install --no-cache-dir --index-url https://pypi.org/simple/ pottslab
          python -c "
          import numpy as np, pottslab
          from importlib.metadata import version
          out = pottslab.min_l2_potts(np.zeros(8), gamma=0.1)
          assert out.shape == (8,), f'unexpected shape {out.shape}'
          print(f'pottslab {version(\"pottslab\")} verify OK')
          "
